[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muon-research"
version = "0.1.0"
description = "Experiments and analysis for Muon/Geon optimizer research"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "ipykernel",
    "ipywidgets",
    "huggingface_hub",
    "datasets",
    "tiktoken",
    "tokenizers",
    "PyYAML",
    "torch",
    "torchvision",
    "numpy",
    "polars",
    "matplotlib",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["muon_research*", "notebooks*"]
