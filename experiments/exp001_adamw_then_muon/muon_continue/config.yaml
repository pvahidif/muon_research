__for_ref:
  override: &OVERRIDE
    rules.two_d.update: adamw
    rules.two_d.sizing: learning_rate
    rules.two_d.lr: 0.003
    rules.two_d.betas: [0.9, 0.95]
    rules.two_d.nesterov: false
    rules.two_d.wd_raw: 0.0002

  metric_schedule: &metric_schedule
    _type: schedule
    schedule:
      - [0, 4, 1]
      - [4, 16, 2]
      - [16, 64, 4]
      - [64, 256, 8]
      - [256, 1024, 16]
      - [1024, 4096, 64]

runs:
  - name: adamw_no_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_000010
    checkpoint_step: [11, 14, 26]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule

  - name: adamw_no_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_000100
    checkpoint_step: [101, 104, 116]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule

  - name: adamw_no_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_000200
    checkpoint_step: [201, 204, 216]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule

  - name: adamw_no_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_000500
    checkpoint_step: [501, 504, 516]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule

  - name: adamw_no_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_001000
    checkpoint_step: [1001, 1004, 1016]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule


  - name: adamw_with_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_000200
    checkpoint_step: [201, 204, 216]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule
    reset_optimizer_state: true
    warmup_steps: 10

  - name: adamw_with_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_000500
    checkpoint_step: [501, 504, 516]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule
    reset_optimizer_state: true
    warmup_steps: 10

  - name: adamw_with_reset
    path: experiments/exp001_adamw_then_muon/muon_checkpoints/adamw/step_001000
    checkpoint_step: [1001, 1004, 1016]
    branch_names: [adamw, muon]
    override: *OVERRIDE
    continue_steps: 256
    metric_schedule: *metric_schedule
    reset_optimizer_state: true
    warmup_steps: 10
